<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物學習網站｜總入口</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{ padding-top:0; }
  .top{ display:flex; align-items:center; gap:12px; padding:14px 20px; background:#fff; border-bottom:1px solid var(--c-line); }
  .top h1{ font-size:1.25rem; margin:0; }
  .top .sp{ flex:1; }
  .hero{ background:linear-gradient(120deg,#43A047,#E53935 55%,#1E88E5); color:#fff; border-radius:24px; padding:28px; margin-bottom:22px; }
  .hero h2{ margin:0 0 6px; font-size:1.7rem; }
  .login{ max-width:460px; margin:0 auto; }
  .login label{ display:block; font-weight:700; margin:12px 0 4px; }
  .login input{ width:100%; min-height:52px; border:2px solid var(--c-line); border-radius:14px; padding:8px 14px; font:inherit; font-size:1.1rem; }
  .login input:focus{ outline:none; border-color:#1E88E5; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .err{ color:var(--c-ng); font-weight:700; min-height:1.6em; margin-top:8px; }
  .chapters{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
  .chap{ text-decoration:none; border-top:8px solid var(--cc); display:flex; flex-direction:column; gap:8px; transition:transform .2s; }
  .chap:hover{ transform:translateY(-4px); }
  .chap .ic{ font-size:3rem; }
  .chap .no{ font-weight:900; color:var(--cc); }
  .chap h3{ margin:0; font-size:1.4rem; }
  .chap small{ color:var(--c-muted); }
  .chap .go{ margin-top:auto; font-weight:900; color:var(--cc); }
  .soon{ opacity:.6; border-top-color:#B0BEC5; }
  .hide{ display:none !important; }
  #segWho button[aria-pressed="true"]{ background:#263238; color:#fff; }
  .loading{ text-align:center; padding:60px; color:var(--c-muted); }
</style>
</head>
<body>
<header class="top">
  <span style="font-size:1.8rem">🧬</span><h1>生物學習網站</h1><span class="sp"></span>
  <span id="who" class="hide" style="font-weight:900"></span>
  <a class="btn ghost hide" id="teacherBtn" href="teacher.html">👩‍🏫 老師工具</a>
  <button class="btn ghost hide" id="pwBtn">🔑 改密碼</button>
  <button class="btn hide" id="outBtn">登出</button>
</header>
<main class="wrap">
  <div id="loading" class="loading">連線中…</div>

  <!-- 登入 -->
  <section id="loginBox" class="hide">
    <div class="hero"><h2>歡迎來到生物學習網站 🧬</h2><p style="margin:0">用老師發的帳號登入，就能進入每一章的學習網站。在哪一台平板登入，學習進度都會跟著你。</p></div>
    <div class="card login">
      <div class="seg" id="segWho" style="margin-bottom:6px"><button data-v="stu" aria-pressed="true">🎒 學生登入</button><button data-v="tea">👩‍🏫 老師登入</button></div>
      <form id="stuForm">
        <div class="row2">
          <div><label for="cls">班級</label><input id="cls" inputmode="numeric" autocomplete="off" placeholder="例如 701" required></div>
          <div><label for="seat">座號</label><input id="seat" type="number" min="1" max="99" inputmode="numeric" placeholder="例如 5" required></div>
        </div>
        <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" required>
        <div class="err" id="err"></div>
        <button class="btn" style="width:100%;font-size:1.15rem" type="submit">登入 ▶</button>
        <p style="color:var(--c-muted);font-size:.85rem;margin-bottom:0">忘記密碼請找老師。用完共用平板記得按右上角「登出」。</p>
      </form>
      <form id="teaForm" class="hide">
        <label for="tEmail">電子郵件</label><input id="tEmail" type="email" autocomplete="username" required>
        <label for="tPw">密碼</label><input id="tPw" type="password" autocomplete="current-password" required>
        <div class="err" id="tErr"></div>
        <div id="resetNote" class="hide" role="status" style="background:#e8f5e9;border:2px solid #43a047;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.95rem;line-height:1.6"></div>
        <button class="btn" style="width:100%;font-size:1.15rem" type="submit">老師登入 ▶</button>
        <p style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:0;flex-wrap:wrap"><span><span class="mut" style="font-size:.9rem">還沒有帳號？</span><button type="button" class="btn ghost" id="regOpen" style="min-height:40px;padding:4px 14px;font-size:.9rem">📝 老師註冊</button></span><button type="button" class="btn ghost" id="forgotBtn" style="min-height:40px;padding:4px 14px;font-size:.9rem">忘記密碼？</button></p>
      </form>
      <form id="regForm" class="hide">
        <h3 style="margin:4px 0 6px">📝 老師註冊申請</h3>
        <p class="mut" style="margin-top:0;font-size:.9rem">填好送出後，等管理人審核。通過後會收到一封「設定密碼」的信，點信裡的連結設定自己的密碼，就能登入。</p>
        <label for="rName">您的稱呼</label><input id="rName" autocomplete="name" placeholder="例如 黃老師" required>
        <label for="rEmail">電子郵件</label><input id="rEmail" type="email" autocomplete="email" placeholder="建議用學校信箱" required>
        <div class="err" id="rErr"></div>
        <div id="regNote" class="hide" role="status" style="background:#e8f5e9;border:2px solid #43a047;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.95rem;line-height:1.6"></div>
        <button class="btn" id="regBtn" style="width:100%;font-size:1.15rem" type="submit">送出申請 ▶</button>
        <p style="margin-bottom:0"><button type="button" class="btn ghost" id="regBack" style="min-height:40px;padding:4px 14px;font-size:.9rem">⇦ 回到老師登入</button></p>
      </form>
    </div>
  </section>

  <!-- 章節選單 -->
  <section id="homeBox" class="hide">
    <div class="hero"><h2 id="hello">嗨！</h2><p style="margin:0">選擇要進入的學習網站：</p></div>
    <div class="chapters" id="chapters"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/portal-common.js"></script>
<script>
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  var params = new URLSearchParams(location.search), next = params.get('next') || '';
  if(next && next.indexOf('https://batyunching.github.io/') !== 0) next = '';

  // 學生／老師分頁
  document.querySelectorAll('#segWho button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#segWho button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      $('stuForm').classList.toggle('hide', b.getAttribute('data-v') !== 'stu');
      $('teaForm').classList.toggle('hide', b.getAttribute('data-v') !== 'tea');
      $('regForm').classList.add('hide');
    });
  });
  try{ var last = localStorage.getItem('bio_lastClass'); if(last) $('cls').value = last; }catch(e){}

  $('stuForm').addEventListener('submit', function(e){
    e.preventDefault(); $('err').textContent = '';
    var cls = $('cls').value, seat = $('seat').value;
    if(!validClass(cls)){ $('err').textContent = '班級只能是英文字母或數字，例如 701。'; return; }
    if(!(parseInt(seat, 10) > 0)){ $('err').textContent = '請輸入座號。'; return; }
    try{ localStorage.setItem('bio_lastClass', normClass(cls)); }catch(e2){}
    auth.signInWithEmailAndPassword(emailOf(sidOf(cls, seat)), $('pw').value).catch(function(er){ $('err').textContent = authMsg(er); });
  });
  $('teaForm').addEventListener('submit', function(e){
    e.preventDefault(); $('tErr').textContent = '';
    auth.signInWithEmailAndPassword($('tEmail').value.trim(), $('tPw').value).catch(function(er){
      $('tErr').textContent = /invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(er.code || '') ? '電子郵件或密碼不對。不確定密碼的話，按下面的「忘記密碼？」重設。' : authMsg(er);
    });
  });
  // 忘記密碼：寄出後顯示明顯提醒、按鈕倒數，短時間內重按會先確認
  var RESET_KEY = 'bio_resetSent', COOL = 60;
  function readReset(){ try{ return JSON.parse(localStorage.getItem(RESET_KEY) || 'null'); }catch(e){ return null; } }
  function hhmm(t){ var d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function showResetNote(r){
    var min = Math.max(0, Math.round((Date.now() - r.t) / 60000));
    $('resetNote').innerHTML = '✅ <b>重設密碼的信已經寄出</b>（' + hhmm(r.t) + '，' + (min ? min + ' 分鐘前' : '剛剛') + '）<br>收件信箱：' + esc(r.em) +
      '<br>請到信箱找寄件人 <b>noreply@bio-ch2-bingo.firebaseapp.com</b> 的信，<b>也看看垃圾郵件</b>。<br>不用再按「忘記密碼？」；寄了好幾封的話，<b>用最新的那一封</b>。';
    $('resetNote').classList.remove('hide');
  }
  var coolTimer = null;
  function startCool(r){
    var b = $('forgotBtn'); clearInterval(coolTimer);
    function tick(){
      var left = COOL - Math.floor((Date.now() - r.t) / 1000);
      if(left > 0){ b.disabled = true; b.textContent = '✅ 已寄出（' + left + ' 秒後可再寄）'; }
      else { clearInterval(coolTimer); b.disabled = false; b.textContent = '忘記密碼？'; }
    }
    tick(); coolTimer = setInterval(tick, 1000);
  }
  (function(){ var r = readReset(); if(r && Date.now() - r.t < 30 * 60000){ if(!$('tEmail').value) $('tEmail').value = r.em; showResetNote(r); startCool(r); } })();
  $('forgotBtn').addEventListener('click', function(){
    var em = $('tEmail').value.trim(); $('tErr').textContent = '';
    if(!em){ $('tErr').textContent = '請先在上面填入你的電子郵件，再按「忘記密碼？」。'; return; }
    if(sidFromEmail(em)){ $('tErr').textContent = '學生帳號沒有電子信箱，忘記密碼請找老師。'; return; }
    var r = readReset();
    if(r && r.em.toLowerCase() === em.toLowerCase() && Date.now() - r.t < 30 * 60000){
      var min = Math.max(1, Math.round((Date.now() - r.t) / 60000));
      if(!confirm('你在 ' + hhmm(r.t) + '（約 ' + min + ' 分鐘前）已經寄過重設密碼的信到\n' + em + '\n\n請先到信箱（含垃圾郵件）找找看。\n確定還要再寄一封嗎？')) { showResetNote(r); return; }
    }
    var b = $('forgotBtn'); b.disabled = true; b.textContent = '寄信中…';
    auth.sendPasswordResetEmail(em).then(function(){
      var nr = { em: em, t: Date.now() };
      try{ localStorage.setItem(RESET_KEY, JSON.stringify(nr)); }catch(e){}
      showResetNote(nr); startCool(nr);
    }, function(er){
      b.disabled = false; b.textContent = '忘記密碼？';
      $('tErr').textContent = /too-many-requests/.test(er.code || '') ? '這個信箱短時間內寄太多次了。請先到信箱（含垃圾郵件）找之前寄的信，或過一段時間再試。' : authMsg(er);
    });
  });
  // 老師註冊：用隨機密碼建立帳號（本人不知道），送出申請；管理人通過後寄「設定密碼」信
  $('regOpen').addEventListener('click', function(){ $('teaForm').classList.add('hide'); $('regForm').classList.remove('hide'); if(!$('rEmail').value) $('rEmail').value = $('tEmail').value; });
  $('regBack').addEventListener('click', function(){ $('regForm').classList.add('hide'); $('teaForm').classList.remove('hide'); });
  var regApp = null;
  $('regForm').addEventListener('submit', function(e){
    e.preventDefault(); $('rErr').textContent = '';
    var nm = $('rName').value.trim(), em = $('rEmail').value.trim().toLowerCase();
    if(!nm){ $('rErr').textContent = '請填寫稱呼。'; return; }
    if(sidFromEmail(em) || /@student\.bio$/.test(em)){ $('rErr').textContent = '學生不用註冊，請用老師發的班級座號登入。'; return; }
    var b = $('regBtn'); b.disabled = true; b.textContent = '送出中…';
    var a = new Uint32Array(6); crypto.getRandomValues(a);
    var pw = Array.prototype.map.call(a, function(x){ return x.toString(36); }).join('') + 'Aa1!';
    (regApp ? Promise.resolve(regApp) : (function(){ regApp = firebase.initializeApp(PORTAL_CFG.CONFIG, 'register'); return regApp.auth().setPersistence(firebase.auth.Auth.Persistence.NONE).then(function(){ return regApp; }); })())
      .then(function(app){
        return app.auth().createUserWithEmailAndPassword(em, pw).then(function(cr){
          var u = cr.user;
          return app.database().ref('applications/' + u.uid).set({ name:nm, email:u.email, status:'pending', at:firebase.database.ServerValue.TIMESTAMP })
            .then(function(){ return app.auth().signOut(); });
        });
      }).then(function(){
        $('regNote').innerHTML = '✅ <b>申請已送出</b><br>' + esc(nm) + '（' + esc(em) + '）<br>管理人審核通過後，會寄一封「設定密碼」的信給你（寄件人 noreply@bio-ch2-bingo.firebaseapp.com，也看看垃圾郵件）。點信裡的連結設定密碼後，就能用「老師登入」。';
        $('regNote').classList.remove('hide'); b.textContent = '✅ 已送出';
      }, function(er){
        b.disabled = false; b.textContent = '送出申請 ▶';
        var c = (er && er.code) || '';
        $('rErr').textContent = /email-already-in-use/.test(c) ? '這個電子郵件已經註冊過了。還在審核中的話請等管理人通知；已經通過的話，請回老師登入按「忘記密碼？」設定密碼。'
          : /invalid-email/.test(c) ? '電子郵件格式不對，請再確認一次。' : authMsg(er);
      });
  });

  $('outBtn').addEventListener('click', function(){
    if(!confirm('確定要登出嗎？')) return;
    auth.signOut().then(function(){ location.href = location.pathname; });
  });
  $('pwBtn').addEventListener('click', function(){
    var oldPw = prompt('請輸入「目前的密碼」：'); if(!oldPw) return;
    var nw = prompt('請輸入「新密碼」（至少 6 個字元）：'); if(!nw) return;
    if(nw.length < 6){ alert('新密碼至少要 6 個字元。'); return; }
    var u = auth.currentUser, cred = firebase.auth.EmailAuthProvider.credential(u.email, oldPw);
    u.reauthenticateWithCredential(cred).then(function(){ return u.updatePassword(nw); }).then(function(){
      var sid = sidFromEmail(u.email); if(sid) db.ref('students/' + sid + '/profile/pwChanged').set(true).catch(function(){});
      alert('密碼已更新，請記住新密碼！');
    }).catch(function(er){ alert(authMsg(er)); });
  });

  function renderHome(u, teacher, admin){
    var sid = sidFromEmail(u.email);
    var name = sid ? sid.split('-')[0] + ' 班 ' + parseInt(sid.split('-')[1], 10) + ' 號' : (teacher ? '老師' : u.email);
    $('who').textContent = (teacher ? '👩‍🏫 ' : '👤 ') + name + (admin ? '（管理人）' : '');
    $('hello').textContent = '嗨，' + name + '！';
    $('chapters').innerHTML = PORTAL_CFG.CHAPTERS.map(function(c){
      return '<a class="card chap" style="--cc:'+c.color+'" href="'+c.url+'"><span class="ic">'+c.icon+'</span><span class="no">'+c.no+'</span><h3>'+esc(c.title)+'</h3><small>'+esc(c.units)+'</small><span class="go">進入學習網站 ▶</span></a>';
    }).join('') + '<div class="card chap soon" style="--cc:#90A4AE"><span class="ic">📚</span><span class="no">更多章節</span><h3>製作中…</h3><small>老師完成新的章節後會出現在這裡</small></div>';
    ['who','outBtn'].forEach(function(id){ $(id).classList.remove('hide'); });
    $('pwBtn').classList.remove('hide');
    $('teacherBtn').classList.toggle('hide', !teacher);
    $('homeBox').classList.remove('hide'); $('loginBox').classList.add('hide');
    if(!sid && !teacher) db.ref('applications/' + u.uid + '/status').get().then(function(s){
      var st = s.val(); if(!st) return;
      var msg = st === 'pending' ? '你的老師註冊申請還在審核中，通過後就能使用老師工具。' : st === 'rejected' ? '你的老師註冊申請沒有通過，有問題請洽管理人。' : '';
      if(msg) $('hello').insertAdjacentHTML('afterend', '<p style="margin:6px 0 0;font-weight:700">' + msg + '</p>');
    }).catch(function(){});
  }
  auth.onAuthStateChanged(function(u){
    $('loading').classList.add('hide');
    if(!u || u.isAnonymous){
      ['who','outBtn','pwBtn','teacherBtn','homeBox'].forEach(function(id){ $(id).classList.add('hide'); });
      $('loginBox').classList.remove('hide');
      if(u && u.isAnonymous) auth.signOut();
      return;
    }
    if(next){ location.replace(next); return; }
    getRoles(u.uid).then(function(r){ renderHome(u, r.teacher, r.admin); });
  });
})();
</script>
</body>
</html>
